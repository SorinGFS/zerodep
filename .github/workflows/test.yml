# Verify public tests, documentation coverage, and benchmark execution across supported CI environments.
name: Cross-platform checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Checks need read access to the project and its public workspace-data source.
permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]

    steps:
      # Check out the exact project revision selected by the workflow event.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install each selected Node.js runtime independently on every operating system.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Install package metadata without audit traffic or a generated tracked lockfile.
      - name: Install package
        run: npm install --no-audit --no-fund

      # Check out this project's public tests and benchmarks from workspace data.
      - name: Check out public data
        uses: actions/checkout@v7
        with:
          repository: SorinGFS/public-data
          ref: master
          path: workspace-data
          sparse-checkout: |
            tests/github.com/SorinGFS/zerodep
            benchmarks/github.com/SorinGFS/zerodep

      # Check out the extension-owned runtime helper required by both dispatchers.
      - name: Check out workspace runtime
        uses: actions/checkout@v7
        with:
          repository: SorinGFS/gh-workspace-data
          ref: v0.8.0
          path: workspace-runtime
          sparse-checkout: src/version-layers.js
          sparse-checkout-cone-mode: false

      # Reproduce the ordinary workspace layout generated by gh-workspace-data.
      - name: Materialize public data and runtime
        run: >-
          node -e "const fs = require('node:fs'); fs.cpSync('workspace-data/tests/github.com/SorinGFS/zerodep', '#/public/tests', { recursive: true }); fs.cpSync('workspace-data/benchmarks/github.com/SorinGFS/zerodep', '#/public/benchmarks', { recursive: true }); fs.copyFileSync('workspace-runtime/src/version-layers.js', '#/version-layers.js')"

      # Validate documentation, behavior, and quick benchmark execution.
      - name: Run checks
        run: npm run check
